app:
  github:
    token: test-token
  stackoverflow:
    key: test-key
    access-token: test-access-key
  bot:
    base-url: http://localhost:0
  scheduler:
    interval: PT1H
    batch-size: 100
    thread-count: 2
  database:
    access-type: SQL # INMEMORY, SQL, ORM

spring:
  liquibase:
    change-log: classpath:/db/changelog/master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
